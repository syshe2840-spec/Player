name: subtitle_player
description: پلیر ویدیو با زیرنویس رمزگذاری‌شده
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # موتور پخش ویدیو (بر پایه mpv) و پشتیبانی اندروید
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6

  # انتخاب دستی زیرنویس
  file_picker: ^8.0.0

  # دسترسی به حافظه گوشی
  permission_handler: ^11.3.0

  # کار با مسیر فایل‌ها (پیدا کردن زیرنویس هم‌اسم)
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

