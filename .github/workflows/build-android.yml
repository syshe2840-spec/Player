name: ساخت اپ اندروید

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files
        run: flutter create --platforms=android --org com.vezoo --project-name player .

      - name: Restore our files
        run: |
          git checkout HEAD -- pubspec.yaml lib/main.dart lib/store.dart lib/browser.dart lib/player.dart lib/settings.dart lib/api_service.dart lib/vez_service.dart android_files/MainActivity.kt android_files/icon.png android_files/cpp/vezoo.h android_files/cpp/vezoo.c android_files/cpp/vezoo_jni.c android_files/cpp/CMakeLists.txt lib/whisper_service.dart lib/ai_subtitle_sheet.dart lib/ai_models_screen.dart android_files/cpp/whisper_v2 android_files/WhisperV2Bridge.kt lib/srt_editor_screen.dart lib/ai_batch_queue_screen.dart lib/ai_history_screen.dart lib/opensubtitles_service.dart lib/opensubtitles_search_sheet.dart lib/live_sub_sheet.dart android_files/LiveSubService.kt lib/srt_translation_service.dart lib/srt_translate_sheet.dart lib/live_translation_sync.dart
          MAKT=$(find android -name "MainActivity.kt" | head -1)
          echo "=== Found MainActivity at: $MAKT ==="
          if [ -n "$MAKT" ]; then
            cp android_files/MainActivity.kt "$MAKT"
            echo "=== Replaced! ==="
          else
            mkdir -p android/app/src/main/kotlin/com/vezoo/player/
            cp android_files/MainActivity.kt android/app/src/main/kotlin/com/vezoo/player/MainActivity.kt
          fi
          head -3 "${MAKT:-android/app/src/main/kotlin/com/vezoo/player/MainActivity.kt}"

      - name: Setup C crypto library
        run: |
          mkdir -p android/app/src/main/cpp
          cp android_files/cpp/vezoo.h android/app/src/main/cpp/
          cp android_files/cpp/vezoo.c android/app/src/main/cpp/
          cp android_files/cpp/vezoo_jni.c android/app/src/main/cpp/
          cp android_files/cpp/CMakeLists.txt android/app/src/main/cpp/
          ls android/app/src/main/cpp/

      - name: Setup Whisper v2 native library (AI v2 — experimental, compile-only stage)
        run: |
          mkdir -p android/app/src/main/cpp/whisper_v2
          cp -r android_files/cpp/whisper_v2/. android/app/src/main/cpp/whisper_v2/
          echo "=== whisper_v2 vendored files ==="
          find android/app/src/main/cpp/whisper_v2 -type f | wc -l
          # کپی Kotlin bridge
          MAKT_DIR=$(dirname "$(find android -name "MainActivity.kt" | head -1)")
          if [ -n "$MAKT_DIR" ]; then
            cp android_files/WhisperV2Bridge.kt "$MAKT_DIR/WhisperV2Bridge.kt"
            cp android_files/LiveSubService.kt  "$MAKT_DIR/LiveSubService.kt"
            echo "=== Kotlin files copied ==="
            # اضافه کردن service به AndroidManifest
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if ! grep -q "LiveSubService" "$MANIFEST"; then
              sed -i 's|</application>|        <service android:name="com.vezoo.player.LiveSubService" android:foregroundServiceType="dataSync" android:exported="false"/>\n        </application>|' "$MANIFEST"
              # اضافه کردن permission های Foreground Service
              sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>|' "$MANIFEST"
              echo "=== AndroidManifest updated with LiveSubService ==="
            fi
          fi
          # patch build.gradle.kts برای NDK
          APP=android/app/build.gradle.kts
          if [ ! -f "$APP" ]; then APP=android/app/build.gradle; fi
          if ! grep -q "externalNativeBuild" "$APP"; then
            sed -i "/^android {/a\\    externalNativeBuild { cmake { path(\\\"src/main/cpp/CMakeLists.txt\\\"); version = \\\"3.22.1\\\" } }" "$APP" || true
          fi

      - name: Set app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp android_files/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android_files/icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done || true

      - name: Add storage permissions, PiP and notifications
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <application#' "$M"
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTop"\n            android:supportsPictureInPicture="true"/' "$M" || true
          sed -i 's/android:label="[^"]*"/android:label="Vezoo"/g' "$M" || true
          S=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Vezoo</string>|' "$S" || true
          echo "=== Manifest check ==="; cat "$M" | grep -E "pip|NOTIF|STORAGE|INTERNET|label" || true

      - name: Force compileSdk 36 everywhere
        run: |
          set -e
          APP=android/app/build.gradle.kts
          if [ ! -f "$APP" ]; then APP=android/app/build.gradle; fi
          sed -i 's/flutter\.compileSdkVersion/36/g' "$APP" || true
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' "$APP" || true
          if [ -f android/build.gradle.kts ]; then
            printf '\nsubprojects {\n    val forceSdk = {\n        val ext = extensions.findByName("android")\n        if (ext != null) {\n            try {\n                ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)\n            } catch (e: Exception) {\n                println("skip " + project.name)\n            }\n        }\n    }\n    if (state.executed) { forceSdk() } else { afterEvaluate { forceSdk() } }\n}\n' >> android/build.gradle.kts
          else
            printf '\nsubprojects {\n    def forceSdk = {\n        if (project.hasProperty("android")) { project.android.compileSdkVersion 36 }\n    }\n    if (state.executed) { forceSdk() } else { afterEvaluate { forceSdk() } }\n}\n' >> android/build.gradle
          fi

      - name: Get packages
        run: flutter pub get

      - name: Patch jcenter to mavenCentral (after pub get)
        run: |
          find /root/.pub-cache/hosted/pub.dev -name "*.gradle" 2>/dev/null | while read f; do
            if grep -q "jcenter()" "$f" 2>/dev/null; then
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              echo "Patched: $f"
            fi
          done || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

