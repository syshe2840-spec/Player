name: ساخت اپ اندروید

# این ورک‌فلو هم با هر بار push روی شاخه main اجرا می‌شود،
# هم می‌توانی دستی از تب Actions اجرایش کنی (دکمه Run workflow).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # ۱) دریافت کدهای مخزن
      - name: Checkout
        uses: actions/checkout@v4

      # ۲) نصب جاوا (برای بیلد اندروید لازم است)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ۳) نصب فلاتر
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ۴) ساخت خودکار فایل‌های پلتفرم اندروید (پوشه android و ...)
      - name: Generate Android files
        run: flutter create --platforms=android --org ir.subteam --project-name subtitle_player .

      # ۵) برگرداندن فایل‌های خودمان (چون مرحله بالا ممکن است بازنویسی کند)
      - name: Restore our files
        run: git checkout HEAD -- pubspec.yaml lib/main.dart

      # ۶) بالا بردن compileSdk به 36 (لازمه‌ی پکیج‌های جدید)
      #    این کار خطای checkReleaseAarMetadata را برطرف می‌کند.
      - name: Bump compileSdk to 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          fi

      # ۷) دریافت پکیج‌ها
      - name: Get packages
        run: flutter pub get

      # ۸) ساخت APK نسخه release
      - name: Build APK
        run: flutter build apk --release

      # ۹) آپلود APK تا بتوانی دانلودش کنی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

